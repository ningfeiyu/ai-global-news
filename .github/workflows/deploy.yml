name: Deploy Worker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6          # 从 v4 升级到 v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22                 # 从 20 改成 22（推荐）或 24

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4  # 从 v3 升级到 v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 如果需要指定账号，可以加上：
           accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
